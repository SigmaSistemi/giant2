<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Giant3 – Sigma Sistemi</title>
  <link rel="icon" href="giant3.ico" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f4f8;
      color: #1a2a3a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #ffffff;
      border-bottom: 1px solid #dce4ed;
      padding: 18px 40px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header img { height: 32px; }

    header span {
      font-size: 18px;
      font-weight: 600;
      color: #1a2a3a;
      letter-spacing: 0.5px;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
    }

    .card {
      background: #ffffff;
      border: 1px solid #dce4ed;
      border-radius: 16px;
      padding: 50px 60px;
      max-width: 560px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.08);
    }

    .app-icon {
      width: 120px;
      height: 120px;
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .app-icon img {
      width: 120px;
      height: 120px;
      object-fit: contain;
    }

    h1 {
      font-size: 32px;
      font-weight: 700;
      color: #1a2a3a;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 15px;
      color: #5a7a9a;
      margin-bottom: 36px;
    }

    .btn-download {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #1a6fa8;
      color: #ffffff;
      text-decoration: none;
      font-size: 16px;
      font-weight: 600;
      padding: 14px 32px;
      border-radius: 10px;
      transition: background 0.2s, transform 0.1s;
    }

    .btn-download:hover {
      background: #156092;
      transform: translateY(-1px);
    }

    .btn-download:active { transform: translateY(0); }

    .btn-download svg {
      width: 20px; height: 20px;
      fill: white;
    }

    .meta {
      margin-top: 20px;
      font-size: 12px;
      color: #8aaac8;
    }

    .requirements {
      margin-top: 36px;
      padding-top: 28px;
      border-top: 1px solid #dce4ed;
      text-align: left;
    }

    .requirements h3 {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #8aaac8;
      margin-bottom: 12px;
    }

    .requirements ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .requirements li {
      font-size: 13px;
      color: #5a7a9a;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .requirements li::before {
      content: '✓';
      color: #1a6fa8;
      font-weight: bold;
    }

    footer {
      text-align: center;
      padding: 20px;
      font-size: 12px;
      color: #aac0d8;
    }
  </style>
</head>
<body>

  <header>
    <img src="swHouse.png" alt="Sigma Sistemi" onerror="this.style.display='none'" />
    <span>Sigma Sistemi</span>
  </header>

  <main>
    <div class="card">
      <div class="app-icon">
        <img src="logoSigma.png" alt="Giant3" />
      </div>
      <h1>Giant3</h1>
      <p class="subtitle">Scarica e installa il client Giant3</p>

      <a class="btn-download" href="GiantClient_setup.exe" download>
        <svg viewBox="0 0 24 24"><path d="M12 16l-5-5h3V4h4v7h3l-5 5zm-7 2h14v2H5v-2z"/></svg>
        Scarica GiantClient_setup.exe
      </a>

      <p class="meta">Windows 10 / 11 &nbsp;·&nbsp; x64</p>

      <div class="requirements">
        <h3>Requisiti</h3>
        <ul>
          <li>Windows 10 o superiore (64-bit)</li>
          <li>Connessione Internet</li>
          <li>.NET 10 (installato automaticamente)</li>
        </ul>
      </div>
    </div>
  </main>

  <footer>
    &copy; Sigma Sistemi
  </footer>

</body>
</html>
