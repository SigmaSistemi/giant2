<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Giant3 – Sigma Sistemi</title>
  <link rel="icon" href="giant3.ico" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f4f2;
      color: #1a2a1e;
      min-height: 100vh;
      display: flex;
      align-items: stretch;
      justify-content: center;
    }

    .wrapper {
      display: flex;
      max-width: 860px;
      width: 100%;
      min-height: 100vh;
      box-shadow: 0 0 60px rgba(0,0,0,0.12);
    }

    .sidebar {
      width: 220px;
      flex-shrink: 0;
      background: #006655;
      overflow: hidden;
    }

    .sidebar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    .content {
      flex: 1;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 60px 50px;
    }

    .logo {
      margin-bottom: 40px;
    }

    .logo img {
      height: 48px;
      object-fit: contain;
    }

    h1 {
      font-size: 36px;
      font-weight: 700;
      color: #006655;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 15px;
      color: #6a8a7a;
      margin-bottom: 40px;
    }

    .btn-download {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #006655;
      color: #ffffff;
      text-decoration: none;
      font-size: 16px;
      font-weight: 600;
      padding: 14px 32px;
      border-radius: 10px;
      transition: background 0.2s, transform 0.1s;
      align-self: flex-start;
    }

    .btn-download:hover {
      background: #005545;
      transform: translateY(-1px);
    }

    .btn-download:active { transform: translateY(0); }

    .btn-download svg {
      width: 20px; height: 20px;
      fill: white;
      flex-shrink: 0;
    }

    .meta {
      margin-top: 14px;
      font-size: 12px;
      color: #aabcb4;
    }

    .requirements {
      margin-top: 48px;
      padding-top: 32px;
      border-top: 1px solid #e0ece8;
    }

    .requirements h3 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #aabcb4;
      margin-bottom: 14px;
    }

    .requirements ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .requirements li {
      font-size: 13px;
      color: #5a7a6a;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .requirements li::before {
      content: '✓';
      color: #006655;
      font-weight: bold;
    }

    footer {
      margin-top: 48px;
      font-size: 11px;
      color: #c0d4cc;
    }

    @media (max-width: 600px) {
      .sidebar { display: none; }
      .content { padding: 40px 28px; }
    }
  </style>
</head>
<body>
  <div class="wrapper">

    <div class="sidebar">
      <img src="swHouse.png" alt="" />
    </div>

    <div class="content">
      <div class="logo">
        <img src="logoSigma.png" alt="Sigma Sistemi" />
      </div>

      <h1>Giant3</h1>
      <p class="subtitle">Scarica e installa il client Giant3</p>

      <a class="btn-download" href="GiantClient_setup.exe" download>
        <svg viewBox="0 0 24 24"><path d="M12 16l-5-5h3V4h4v7h3l-5 5zm-7 2h14v2H5v-2z"/></svg>
        Scarica GiantClient_setup.exe
      </a>

      <p class="meta">Windows 10 / 11 &nbsp;·&nbsp; x64</p>

      <div class="requirements">
        <h3>Requisiti</h3>
        <ul>
          <li>Windows 10 o superiore (64-bit)</li>
          <li>Connessione Internet</li>
          <li>.NET 10 (installato automaticamente)</li>
        </ul>
      </div>

      <footer>&copy; Sigma Sistemi</footer>
    </div>

  </div>
</body>
</html>
