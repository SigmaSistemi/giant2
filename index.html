<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Giant2 – Sigma Sistemi</title>
  <link rel="icon" href="giant3.ico" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #e8ede9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .wrapper {
      display: flex;
      width: 720px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.15);
      border-radius: 12px;
      overflow: hidden;
    }

    .sidebar {
      width: 180px;
      flex-shrink: 0;
    }

    .sidebar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .content {
      flex: 1;
      background: #ffffff;
      padding: 40px 44px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow: hidden;
    }

    .logo img {
      height: 32px;
      object-fit: contain;
      margin-bottom: 24px;
      display: block;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      color: #006655;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 13px;
      color: #6a8a7a;
      margin-bottom: 24px;
    }

    .btn-download {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #006655;
      color: #ffffff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      padding: 11px 24px;
      border-radius: 8px;
      transition: background 0.2s, transform 0.1s;
      white-space: nowrap;
      align-self: flex-start;
    }

    .btn-download:hover { background: #005545; transform: translateY(-1px); }
    .btn-download:active { transform: translateY(0); }

    .btn-download svg { width: 16px; height: 16px; fill: white; flex-shrink: 0; }

    .meta {
      margin-top: 8px;
      font-size: 11px;
      color: #aabcb4;
    }

    .requirements {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid #e0ece8;
    }

    .requirements h3 {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #aabcb4;
      margin-bottom: 8px;
    }

    .requirements ul { list-style: none; display: flex; flex-direction: column; gap: 5px; }

    .requirements li {
      font-size: 12px;
      color: #5a7a6a;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .requirements li::before { content: '✓'; color: #006655; font-weight: bold; }

    footer {
      margin-top: 20px;
      font-size: 10px;
      color: #c0d4cc;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="sidebar">
      <img src="swHouse.png" alt="" />
    </div>
    <div class="content">
      <div class="logo">
        <img src="logoSigma.png" alt="Sigma Sistemi" />
      </div>
      <h1>Giant2</h1>
      <p class="subtitle">Scarica e installa il client Giant2</p>
<a class="btn-download" href="GiantClient_setup.exe" download
   onclick="window.goatcounter && window.goatcounter.count({
     path: 'download-giantclient',
     title: 'Download GiantClient',
     event: true
   })">
  <svg viewBox="0 0 24 24"><path d="M12 16l-5-5h3V4h4v7h3l-5 5zm-7 2h14v2H5v-2z"/></svg>
  Scarica GiantClient_setup.exe
</a>
      <p class="meta">Windows 10 / 11 &nbsp;·&nbsp; x64</p>
      <div class="requirements">
        <h3>Requisiti</h3>
        <ul>
          <li>Windows 10 o superiore (64-bit)</li>
        </ul>
      </div>
<footer>
  &copy; Sigma Sistemi &nbsp;·&nbsp;
  <a href="privacy.html" style="color:#c0d4cc; text-decoration:underline;">Informativa privacy</a>
</footer>
    </div>
  </div>
  <script data-goatcounter="https://davidesigma.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</body>
</html>
